<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Play Lab</title>
  <meta name="description" content="Plant Play Lab — website coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Annie+Use+Your+Telescope&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f1eee8; --ink: #1f2420; --sage: #556b4f; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #171a17; --ink: #eeece6; --sage: #9db394; }
    }
    :root[data-theme="dark"] { --bg: #171a17; --ink: #eeece6; --sage: #9db394; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      display: grid; place-items: center; text-align: center; padding: 16px;
      box-sizing: border-box;
    }
    h1 { font: 700 clamp(56px, 12vw, 112px)/1 "Amatic SC", cursive; margin: 0; }
    p { font: 400 clamp(22px, 4vw, 30px)/1.2 "Annie Use Your Telescope", cursive; color: var(--sage); margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Plant Play Lab</h1>
    <p>Website coming soon</p>
  </main>
</body>
</html>
